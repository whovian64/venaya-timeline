name: Process entries
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
concurrency:
  group: entries
  cancel-in-progress: false
jobs:
  process:
    if: github.event_name == 'issues' || (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/process.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
